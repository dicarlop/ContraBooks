<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 114" role="img" aria-labelledby="title desc">
  <title id="title">ContraBooks</title>
  <desc id="desc">ContraBooks — Simple. Powerful. Yours.</desc>
  <defs>
    <linearGradient id="cBlueGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.52" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="1" x2="1" y2="0">
