name: Windows Electron build

on:
  push:
    branches: [master, 'maintenance/**']
  pull_request:
    branches: [master]

# Windows packaging must not be cancelled by Linux validation or another
# maintenance commit. Windows builds are intentionally independent.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --no-deprecation
  BROWSERSLIST_IGNORE_OLD_DATA: 'true'

jobs:
  windows-build:
    name: Windows Electron build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Configure Git defaults
        shell: pwsh
        run: git config --global init.defaultBranch main
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.8.0
          cache: yarn
      - name: Enable Corepack and pin Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version
      - name: Install dependencies
        shell: pwsh
        run: yarn install --frozen-lockfile --non-interactive --silent
      - name: Full Windows package build
        shell: pwsh
        run: yarn build --win --x64 --nosign --publish never
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path dist_electron -File -Filter *.exe
          if ($artifacts.Count -eq 0) { throw 'Electron Builder produced no Windows .exe artifacts.' }
          $artifacts | Select-Object Name, Length
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ContraBooks-Windows-x64
          path: dist_electron/*.exe
          if-no-files-found: error
          retention-days: 14
