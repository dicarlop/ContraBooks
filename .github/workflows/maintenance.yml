name: Maintenance checks

on:
  push:
    branches: [master, 'maintenance/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.8.0
          cache: yarn

      - name: Install test shell and display server
        run: sudo apt-get update && sudo apt-get install -y zsh xvfb

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Ensure Electron runtime
        run: |
          node node_modules/electron/install.js
          test -x node_modules/electron/dist/electron
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          node node_modules/electron/cli.js --version

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Production source build
        run: yarn build --nopackage

      - name: Electron UI smoke tests
        run: xvfb-run -a yarn uitest

      - name: Dependency audit
        run: |
          set +e
          yarn audit --groups dependencies --json > audit.json
          audit_status=$?
          set -e

          node <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('audit.json', 'utf8').split(/\r?\n/).filter(Boolean);
          const advisories = [];
          for (const line of lines) {
            try {
              const item = JSON.parse(line);
              if (item.type === 'auditAdvisory' && item.data?.advisory) {
                advisories.push(item.data.advisory);
              }
            } catch (_) {}
          }

          const rank = { low: 0, moderate: 1, high: 2, critical: 3 };
          const severe = advisories.filter((a) => (rank[a.severity] ?? 99) >= rank.high);
          const moderate = advisories.filter((a) => a.severity === 'moderate');

          console.log(`Advisories: ${advisories.length}; moderate: ${moderate.length}; high/critical: ${severe.length}`);
          for (const advisory of severe) {
            console.log(`HIGH/CRITICAL: ${advisory.module_name} ${advisory.severity} ${advisory.title}`);
          }

          if (severe.length > 0) process.exit(1);
          NODE

          if [ "$audit_status" -ne 0 ] && [ "$audit_status" -ne 4 ]; then
            echo "yarn audit failed unexpectedly with exit code $audit_status"
            exit "$audit_status"
          fi
          if [ "$audit_status" -eq 4 ]; then
            echo "Yarn reported vulnerabilities, but none are high or critical; continuing."
          fi

  windows-build:
    name: Windows Electron build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.8.0
          cache: yarn

      - name: Enable Corepack and pin Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version

      - name: Install dependencies
        shell: pwsh
        run: yarn install --frozen-lockfile --non-interactive

      - name: Full Windows package build
        shell: pwsh
        run: yarn build --win --x64 --nosign --publish never

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path dist_electron -File -Filter *.exe
          if ($artifacts.Count -eq 0) {
            throw 'Electron Builder produced no Windows .exe artifacts.'
          }
          $artifacts | Select-Object Name, Length
