name: Maintenance checks

on:
  push:
    branches: [master, 'maintenance/**']
  pull_request:
    branches: [master]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --no-deprecation
  BROWSERSLIST_IGNORE_OLD_DATA: 'true'

jobs:
  fix-vue-tsc-events:
    name: Apply vue-tsc event-handler fixes
    if: github.event_name == 'push' && github.ref == 'refs/heads/maintenance/2026-09'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Replace inline event callbacks with $event
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'src/components/TwoColumnForm.vue': [
                  ('@change="async (value: unknown) => await onChange(df, value)"', '@change="onChange(df, $event)"'),
              ],
              'src/pages/QuickEditForm.vue': [
                  ('@change="(value: unknown) => valueChange(titleField as Field, value)"', '@change="valueChange(titleField as Field, $event)"'),
              ],
              'src/pages/Report.vue': [
                  ('@change="async (value: unknown) => await report?.set(field.fieldname, value)"', '@change="report?.set(field.fieldname, $event)"'),
              ],
              'src/pages/TemplateBuilder/TemplateBuilder.vue': [
                  ('@change="async (value: unknown) => await doc?.set(\'name\', value)"', '@change="doc?.set(\'name\', $event)"'),
                  ('@change="async (value: unknown) => await setType(value)"', '@change="setType($event)"'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No expected replacement found in {filename}')
              path.write_text(text)
          PY
      - name: Commit event-handler fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/TwoColumnForm.vue src/pages/QuickEditForm.vue src/pages/Report.vue src/pages/TemplateBuilder/TemplateBuilder.vue
          git commit -m 'fix(types): use typed Vue event payloads'
          git push

  checks:
    needs: fix-vue-tsc-events
    if: always() && (needs.fix-vue-tsc-events.result == 'success' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.8.0
          cache: yarn
      - name: Install test shell and display server
        run: sudo apt-get update && sudo apt-get install -y zsh xvfb dbus-x11
      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --silent
      - name: Ensure Electron runtime
        run: |
          node node_modules/electron/install.js
          test -x node_modules/electron/dist/electron
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          node node_modules/electron/cli.js --version
      - name: Lint
        run: yarn lint
      - name: TypeScript and Vue typecheck
        run: yarn typecheck
      - name: Unit tests
        run: yarn test
      - name: Production source build
        run: yarn build --nopackage
      - name: Electron UI smoke tests
        run: dbus-run-session -- xvfb-run -a yarn uitest
      - name: Dependency audit
        run: |
          set +e
          yarn audit --groups dependencies --json > audit.json
          audit_status=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('audit.json', 'utf8').split(/\r?\n/).filter(Boolean);
          const advisories = [];
          for (const line of lines) {
            try {
              const item = JSON.parse(line);
              if (item.type === 'auditAdvisory' && item.data?.advisory) advisories.push(item.data.advisory);
            } catch (_) {}
          }
          const rank = { low: 0, moderate: 1, high: 2, critical: 3 };
          const severe = advisories.filter((a) => (rank[a.severity] ?? 99) >= rank.high);
          const moderate = advisories.filter((a) => a.severity === 'moderate');
          console.log(`Advisories: ${advisories.length}; moderate: ${moderate.length}; high/critical: ${severe.length}`);
          for (const advisory of moderate) console.log(`MODERATE: ${advisory.module_name} ${advisory.title} (patched: ${advisory.patched_versions})`);
          for (const advisory of severe) console.log(`HIGH/CRITICAL: ${advisory.module_name} ${advisory.severity} ${advisory.title}`);
          if (severe.length > 0) process.exit(1);
          NODE
          if [ "$audit_status" -ne 0 ] && [ "$audit_status" -ne 4 ]; then
            echo "yarn audit failed unexpectedly with exit code $audit_status"
            exit "$audit_status"
          fi
          if [ "$audit_status" -eq 4 ]; then
            echo "Yarn reported vulnerabilities, but none are high or critical; continuing."
          fi

  windows-build:
    name: Windows Electron build
    needs: fix-vue-tsc-events
    if: always() && (needs.fix-vue-tsc-events.result == 'success' || github.event_name == 'pull_request')
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Configure Git defaults
        shell: pwsh
        run: git config --global init.defaultBranch main
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.8.0
          cache: yarn
      - name: Enable Corepack and pin Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version
      - name: Install dependencies
        shell: pwsh
        run: yarn install --frozen-lockfile --non-interactive --silent
      - name: Full Windows package build
        shell: pwsh
        run: yarn build --win --x64 --nosign --publish never
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path dist_electron -File -Filter *.exe
          if ($artifacts.Count -eq 0) { throw 'Electron Builder produced no Windows .exe artifacts.' }
          $artifacts | Select-Object Name, Length
