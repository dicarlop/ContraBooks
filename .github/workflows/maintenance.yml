name: Maintenance checks

on:
  push:
    branches: [master, 'maintenance/**']
  pull_request:
    branches: [master]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.5
          cache: yarn

      - name: Install test shell
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Commit normalized lockfile
        if: github.ref == 'refs/heads/maintenance/2026-09'
        run: |
          if git diff --quiet -- yarn.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git commit -m "fix: synchronize yarn lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-yarn-lock
          path: yarn.lock
          if-no-files-found: error

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Production source build
        run: yarn build --nopackage

      - name: Dependency audit
        run: yarn audit --groups dependencies --level high
