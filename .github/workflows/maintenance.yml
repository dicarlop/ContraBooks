name: Maintenance checks

on:
  push:
    branches: [master, 'maintenance/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: yarn

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Production source build
        run: yarn build --nopackage

      - name: Dependency audit
        run: yarn audit --groups dependencies --level high
