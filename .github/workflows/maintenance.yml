name: Maintenance checks

on:
  push:
    branches: [master, 'maintenance/**']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: yarn

      - name: Install test shell
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Refresh PostCSS security patch
        if: github.sha == '24a5c4c5cd319138a5ecad480564c086f144283a'
        run: |
          yarn upgrade postcss@^8.5.18 --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          if ! git diff --cached --quiet; then
            git commit -m "fix: update postcss security patch"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Production source build
        run: yarn build --nopackage

      - name: Dependency audit
        run: yarn audit --groups dependencies --level high
